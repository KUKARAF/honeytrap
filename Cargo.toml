[package]
name = "honeytrap"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "honeytrap"
path = "src/lib.rs"

[[bin]]
name = "honeytrap"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["catch-panic"] }
clap = { version = "4", features = ["derive"] }
minijinja = { version = "2", default-features = false, features = ["serde"] }
rand_core = "0.6"
rand_chacha = "0.3"
blake3 = "1"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "1"
anyhow = "1"

[dev-dependencies]
http-body-util = "0.1"
regex = "1"

[profile.release]
lto = true
strip = true
opt-level = "z"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
