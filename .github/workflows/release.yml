name: build-and-release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build static release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/honeytrap dist/honeytrap-x86_64-unknown-linux-musl
          tar -C templates -czf dist/honeytrap-templates.tar.gz .

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (${{ github.sha }})"
          prerelease: true
          make_latest: false
          body: "Automated build from commit ${{ github.sha }} on ${{ github.ref_name }}."
          files: |
            dist/honeytrap-x86_64-unknown-linux-musl
            dist/honeytrap-templates.tar.gz
