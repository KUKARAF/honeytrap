name: build-and-release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # No build cache here: a release must not restore state a PR run could have written.

      - name: Test
        run: cargo test --locked

      - name: Build static release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/honeytrap dist/honeytrap-x86_64-unknown-linux-musl
          tar -C templates -czf dist/honeytrap-templates.tar.gz .

      - name: Publish rolling release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: "Latest build (${{ github.sha }})"
          prerelease: true
          make_latest: false
          body: "Automated build from commit ${{ github.sha }} on ${{ github.ref_name }}."
          files: |
            dist/honeytrap-x86_64-unknown-linux-musl
            dist/honeytrap-templates.tar.gz
