name: CI (required)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: ci-required-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    name: Rust (panic-safety clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (panic-safety gate, production code only)
        run: cargo clippy --lib --bins
